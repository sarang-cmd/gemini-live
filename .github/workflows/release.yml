name: release

# Builds the desktop installers and publishes them as a GitHub release.
#
# The workflow runs on real Windows and Linux runners, so the installer is
# produced with the tools of that operating system: the NSIS installer and
# the portable exe on Windows, the AppImage and the deb on Linux.
#
# The installers are also committed to the repository, so the files are part
# of the source tree and not only in the release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the release, for example v2.0.0. Leave empty to build without releasing.'
        required: false

permissions:
  contents: write

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm install

      - name: Build the application
        run: npm run build

      - name: Package
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
            if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-latest
    # The AppImage is built without FUSE, which the runner does not have, and
    # a failure here must not keep the Windows installers from being released.
    continue-on-error: true
    env:
      ELECTRON_BUILDER_APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm install

      - name: Build the application
        run: npm run build

      - name: Package
        run: npx electron-builder --linux --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/*.yml
            if-no-files-found: error

  release:
    name: Release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.tag != ''
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          # The artifacts keep the release directory they were taken from, so the
          # files are found by name and not by a glob over the top directory.
          mapfile -t files < <(find artifacts -type f | sort)
          ls -la artifacts/release
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No installer was built.'
            exit 1
          fi
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber
          else
            gh release create "$TAG" --repo "$REPO" --verify-tag \
              --title "Halo $TAG" \
              --notes "The desktop build of Halo: the NSIS installer and the portable exe for Windows, the AppImage and the deb for Linux." \
              "${files[@]}"
          fi

  repository:
    name: Add the installers to the repository
    needs: [windows, linux]
    runs-on: ubuntu-latest
    # The release above is the deliverable. A failure here must not undo it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Commit the installers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release
          while IFS= read -r file; do
            size=$(stat -c%s "$file")
            if [ "$size" -lt 100000000 ]; then
              cp "$file" "release/$(basename "$file")"
            else
              echo "$(basename "$file") is $size bytes: too large for git, it stays in the release"
            fi
          done < <(find artifacts -type f | sort)
          ls -la release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f release
          if git diff --cached --quiet; then
            echo 'The repository already holds these installers.'
            exit 0
          fi
          git commit -m "Add the installers built for this tag"
          git pull --rebase origin main
          git push origin HEAD:main
