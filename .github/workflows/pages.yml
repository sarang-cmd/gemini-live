name: pages

# Publishes the marketing site to GitHub Pages.
#
# The site is the same build that Vercel serves: `npm run site:build`. The Vercel project
# sits behind the deployment protection of the account, which asks a visitor to sign in, so
# the Pages site is the address that is open to everyone.
#
# Pages for this repository publishes from the `gh-pages` branch. The workflow builds the
# site, writes it to that branch and asks GitHub to publish it.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # GitHub Pages serves the site under the name of the repository.
      SITE_BASE: /gemini-live/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm install

      - name: Build the site
        run: npm run site:build

      - name: Add the page for the routes that are not files
        # The site has real paths, so a visitor who opens /download directly
        # needs a page to answer with.
        run: cp site/dist/index.html site/dist/404.html

      - name: Remember what was built
        id: build
        run: |
          asset=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' site/dist/index.html | head -1)
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "The build is $asset"

      - name: Write the site to the gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          publish="$RUNNER_TEMP/pages"
          rm -rf "$publish"
          mkdir -p "$publish"
          cp -r site/dist/. "$publish/"
          # Jekyll would drop the files it does not recognise, so the branch
          # is published as it is.
          touch "$publish/.nojekyll"
          cd "$publish"
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -q -m 'Publish the site'
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages

      - name: Ask GitHub to publish the branch
        # A push that uses the workflow token does not start a Pages build on its
        # own, so the build is asked for here. GitHub keeps a record of the push
        # as well, and that record fails; the build requested here is the one that
        # publishes the branch.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Check that the site serves this build
        env:
          ASSET: ${{ steps.build.outputs.asset }}
        run: |
          for attempt in $(seq 1 24); do
            if curl -fsS 'https://sarang-cmd.github.io/gemini-live/' | grep -q "$ASSET"; then
              echo "The site serves $ASSET."
              exit 0
            fi
            sleep 10
          done
          echo "The site does not serve $ASSET yet." >&2
          exit 1
